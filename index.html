<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Volley Pro">
<meta name="theme-color" content="#080808">
<title>Volley Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080808; --s1:#111; --s2:#181818;
  --bd:rgba(255,255,255,0.07);
  --tx:#f0f0f0; --mu:#666; --mu2:#3a3a3a;
  --A:#E8FF3A; --B:#3AFFB8; --C:#FF6B3A; --D:#C77DFF;
  --red:#FF5555;
  --st:env(safe-area-inset-top);
  --sb:env(safe-area-inset-bottom);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html{background:var(--bg);height:100%;}
body{background:var(--bg);color:var(--tx);font-family:'Barlow',sans-serif;font-size:15px;min-height:100vh;min-height:-webkit-fill-available;overscroll-behavior:none;-webkit-font-smoothing:antialiased;}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
input{font-family:'Barlow',sans-serif;}
button{font-family:'Barlow',sans-serif;}

/* HEADER */
.hdr{padding:calc(var(--st) + 16px) 20px 0;background:var(--bg);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--bd);}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.ttl{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;letter-spacing:1px;line-height:1;text-transform:uppercase;}
.sub{font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin-top:3px;}
.wk{display:flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:5px 8px;}
.wkb{background:none;border:none;color:var(--mu);font-size:20px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.wkb:active{background:rgba(255,255,255,0.1);}
.wkl{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px;min-width:36px;text-align:center;}

/* PHASE */
.phbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
.phbdg{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;padding:4px 12px;border-radius:6px;text-transform:uppercase;cursor:pointer;border:1px solid transparent;transition:all 0.2s;}
.ph1on{background:rgba(232,255,58,0.15);border-color:var(--A);color:var(--A);}
.ph2on{background:rgba(58,255,184,0.15);border-color:var(--B);color:var(--B);}
.phoff{background:var(--s2);color:var(--mu);border-color:var(--bd);}
.phdesc{font-size:11px;color:var(--mu);flex:1;}

/* NAV */
.nav{display:flex;}
.nt{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:10px 0 9px;font-size:11px;font-weight:600;letter-spacing:0.5px;color:var(--mu);cursor:pointer;transition:all 0.2s;text-transform:uppercase;}
.nt.on{color:var(--tx);border-bottom-color:#fff;}

/* CONTENT */
.cnt{padding:18px 20px calc(var(--sb) + 20px);flex:1;}

/* DAY TABS */
.dtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.dt{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 0;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:3px;}
.dtl{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;line-height:1;color:var(--mu2);}
.dts{font-size:9px;color:var(--mu2);text-transform:uppercase;letter-spacing:0.5px;}

/* MODULAR HINT */
.mhint{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:18px;}
.mrow{display:flex;align-items:center;gap:8px;margin-top:6px;}
.mkey{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:var(--mu);min-width:52px;}
.mchip{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;padding:2px 8px;border-radius:5px;border:1px solid;}

/* DAY HEADER */
.dhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.dbig{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:1px;}
.dsub{font-size:11px;color:var(--mu);margin-top:3px;letter-spacing:0.5px;text-transform:uppercase;}
.dnbtn{background:transparent;border:1.5px solid;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;white-space:nowrap;margin-top:4px;}

/* WARMUP */
.wu{background:rgba(255,85,85,0.07);border:1px solid rgba(255,85,85,0.2);border-radius:12px;padding:13px;margin-bottom:14px;}
.wutit{font-size:10px;font-weight:700;color:var(--red);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;}
.wuit{font-size:12px;color:#aaa;padding:2px 0;}
.wuit::before{content:'— ';color:var(--red);opacity:0.5;}

/* PHASE NOTE */
.phnote{background:rgba(232,255,58,0.06);border:1px solid rgba(232,255,58,0.2);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#c8e030;line-height:1.6;}

/* EXERCISE CARD */
.ec{background:var(--s1);border:1px solid var(--bd);border-radius:14px;margin-bottom:9px;overflow:hidden;transition:border-color 0.2s;}
.ec.open{border-color:rgba(255,255,255,0.15);}
.ech{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;}
.ech:active{background:rgba(255,255,255,0.03);}
.ecl{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.ecdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ecn{font-weight:600;font-size:14px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ecb{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:var(--mu);background:rgba(255,255,255,0.05);border-radius:5px;padding:2px 7px;white-space:nowrap;flex-shrink:0;}
.ecr{display:flex;align-items:center;gap:7px;flex-shrink:0;margin-left:6px;}
.ecklg{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;}
.ecch{color:var(--mu2);font-size:16px;transition:transform 0.2s;}
.ec.open .ecch{transform:rotate(90deg);}
.ecb2{border-top:1px solid var(--bd);padding:13px 15px 15px;display:none;}
.ec.open .ecb2{display:block;}
.eclbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;}
.ecex{font-size:13px;color:#bbb;line-height:1.75;margin-bottom:11px;}
.ectip{font-size:12px;color:var(--mu);font-style:italic;line-height:1.6;padding:9px;background:rgba(255,255,255,0.03);border-radius:8px;margin-bottom:11px;}
.ectip::before{content:'💡 ';}
.ecwarn{font-size:12px;color:#ff9090;background:rgba(255,85,85,0.08);border:1px solid rgba(255,85,85,0.2);border-radius:8px;padding:9px 12px;margin-bottom:11px;line-height:1.6;}
.ecwarn::before{content:'⚠️ ';}

/* LOG */
.lgtog{background:rgba(255,255,255,0.06);border:1px solid var(--bd);border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer;display:inline-block;margin-bottom:11px;}
.lgtog.on{background:rgba(255,255,255,0.1);color:var(--tx);}
.lgarea{display:none;}
.lgarea.on{display:block;}
.lgrow{display:flex;gap:7px;margin-bottom:9px;}
.lgi{background:rgba(255,255,255,0.06);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;color:var(--tx);font-size:13px;outline:none;transition:border-color 0.2s;}
.lgi:focus{border-color:rgba(255,255,255,0.25);}
.lgi.kg{width:68px;}
.lgi.nt{flex:1;}
.lgadd{padding:7px 14px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.lgadd:active{opacity:0.7;}
.lge{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:rgba(255,255,255,0.03);border-radius:7px;font-size:12px;margin-bottom:4px;}
.lgedt{color:var(--mu);}
.lgekg{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;}
.lgenote{color:var(--mu);font-style:italic;font-size:11px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lgempty{color:var(--mu2);font-size:12px;padding:3px 0;}

/* CHART */
.chbars{display:flex;align-items:flex-end;gap:4px;height:40px;margin-bottom:3px;margin-top:10px;}
.chbar{flex:1;border-radius:3px 3px 0 0;min-height:4px;opacity:0.8;}
.chlbls{display:flex;gap:4px;}
.chlbl{flex:1;font-size:9px;color:var(--mu2);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* OVERVIEW */
.ovgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px;}
.ovcard{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;}
.ovnum{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;line-height:1;}
.ovlbl{font-size:11px;color:var(--mu);margin-top:3px;letter-spacing:0.5px;text-transform:uppercase;}

/* GUIDE */
.gnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch;}
.gnav::-webkit-scrollbar{display:none;}
.gnav{scrollbar-width:none;}
.gnbtn{background:var(--s2);color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all 0.2s;flex-shrink:0;}
.gnbtn.on{color:#000;}
.gtit{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px;}
.gcard{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:11px;font-size:13px;color:#bbb;line-height:1.8;}
.gtable{background:var(--s1);border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:11px;}
.gtrow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);}
.gtrow:last-child{border-bottom:none;}
.gtleft{font-size:13px;color:#bbb;}
.gtright{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;}

/* SECTION TITLE */
.stit{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:11px;}

/* EXERCISE GUIDE CARDS */
.egcat{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;margin-top:4px;}
.egcard{background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:9px;overflow:hidden;}
.egch{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
.egch:active{background:rgba(255,255,255,0.03);}
.egnm{font-weight:600;font-size:14px;}
.egday{font-family:'Barlow Condensed',sans-serif;font-size:12px;padding:2px 8px;border-radius:5px;border:1px solid;font-weight:700;}
.egbody{border-top:1px solid var(--bd);padding:13px 15px;display:none;}
.egcard.open .egbody{display:block;}
.egcard.open .ecch{transform:rotate(90deg);}
.egsec{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px;margin-top:11px;}
.egsec:first-child{margin-top:0;}
.egtext{font-size:13px;color:#bbb;line-height:1.75;margin-bottom:4px;}
.eglist{margin:0;padding-left:0;list-style:none;}
.eglist li{font-size:13px;color:#bbb;line-height:1.75;padding:2px 0;padding-left:14px;position:relative;}
.eglist li::before{content:'—';position:absolute;left:0;color:var(--mu);}
.egmuscles{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.egmtag{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,0.06);color:var(--mu);border:1px solid var(--bd);}

/* NOTE CARD */
.nc{border-left:3px solid;padding:12px 14px;background:var(--s1);border-radius:0 10px 10px 0;margin-bottom:11px;}
.nct{font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:5px;}
.nctx{font-size:13px;color:#aaa;line-height:1.7;}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--sb) + 20px);left:50%;transform:translateX(-50%) translateY(20px);background:rgba(255,255,255,0.95);color:#000;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ANIM */
@keyframes fu{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.cnt>*{animation:fu 0.22s ease both;}
.cnt>*:nth-child(2){animation-delay:.04s;}
.cnt>*:nth-child(3){animation-delay:.08s;}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hdr-top">
      <div>
        <div class="ttl">Volley <span id="ttlAccent">Pro</span></div>
        <div class="sub">Centrale — Serie D</div>
      </div>
      <div class="wk">
        <button class="wkb" onclick="changeWeek(-1)">‹</button>
        <div class="wkl" id="wkLabel">W1</div>
        <button class="wkb" onclick="changeWeek(1)">›</button>
      </div>
    </div>
    <div class="phbar">
      <div class="phbdg" id="ph1" onclick="setPhase(1)">Fase 1</div>
      <div class="phbdg" id="ph2" onclick="setPhase(2)">Fase 2</div>
      <div class="phdesc" id="phDesc"></div>
    </div>
    <div class="nav">
      <button class="nt" id="tn-workout" onclick="goSection('workout')">Scheda</button>
      <button class="nt" id="tn-overview" onclick="goSection('overview')">Riepilogo</button>
      <button class="nt" id="tn-guide" onclick="goSection('guide')">Guida</button>
    </div>
  </div>
  <div class="cnt" id="cnt"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ─── COLORS ───────────────────────────────────────────────
const COL = {A:'#E8FF3A',B:'#3AFFB8',C:'#FF6B3A',D:'#C77DFF'};

// ─── WORKOUT DATA ─────────────────────────────────────────
const WK = {
  A:{title:'Lower — Forza/Potenza',upper:false,ex:[
    {id:'squat',name:'Squat Bilanciere',compound:true,sets:4,reps:'5',
     muscles:['Quadricipiti','Glutei','Ischiocrurali','Core'],
     execution:'Piedi a larghezza spalle, punte aperte 30°. Bilanciere sul trapezio basso (non sul collo). Discesa controllata in 3 sec mantenendo il petto alto e le ginocchia verso le punte. Profondità: coscia parallela o sotto al pavimento. Risalita esplosiva spingendo il pavimento lontano da te. Mantieni tutta la pianta del piede a contatto col suolo.',
     cues:['Schiena neutra per tutto il movimento','Ginocchia seguono le punte, non collassano verso l\'interno','Respira prima della discesa, espira risalendo','Occhi dritti o leggermente verso l\'alto'],
     errors:['Talloni che si sollevano: lavora la mobilità della caviglia','Busto che crolla in avanti: rafforza il core e i dorsali','Valgismo del ginocchio: attiva i glutei medi'],
     tip:'Il ritmo è tutto: lento in discesa, esplosivo in salita. Questo pattern si trasferisce direttamente alla potenza del salto.',
     warning:null},
    {id:'rdl',name:'Romanian Deadlift',compound:true,sets:3,reps:'8',
     muscles:['Ischiocrurali','Glutei','Erettori spinali'],
     execution:'Piedi a larghezza anca, bilanciere sulle cosce. Cerniera all\'anca: spingi i glutei indietro mentre il bilanciere scivola lungo le cosce. Scendi finché senti tensione negli ischiocrurali (di solito metà tibia), non oltre. Schiena perfettamente neutra per tutto il movimento. Risalita contraendo i glutei.',
     cues:['Non è uno stacco: non piegare molto le ginocchia','Bilanciere sempre a contatto con le cosce','Senti lo stretch degli ischiocrurali, non della schiena','Capo neutro, sguardo a terra 1m davanti'],
     errors:['Schiena che si arrotonda: riduci il peso','Scendere troppo perdendo la schiena neutra: fermati prima','Ginocchia che si piegano troppo: diventa uno stacco convenzionale'],
     tip:'Ischio-crurali forti = meno infortuni al ginocchio nei salti ripetuti.',
     warning:null},
    {id:'legpress',name:'Leg Press',compound:false,sets:3,reps:'10',
     muscles:['Quadricipiti','Glutei','Ischiocrurali'],
     execution:'Piedi alti e larghi sulla piattaforma per enfatizzare i glutei. Scendi finché le cosce sono parallele o sotto, senza sollevare i glutei dal sedile. Spingi con tutta la pianta del piede. Non bloccare le ginocchia in estensione completa.',
     cues:['Schiena sempre appoggiata allo schienale','Non rimbalzare in basso','Piedi alti = glutei, piedi bassi = quadricipiti: usa quelli alti'],
     errors:['Glutei che si sollevano: range troppo ampio, riducilo','Ginocchia che collassano: attiva i glutei'],
     tip:'Ottima alternativa allo squat nei giorni in cui la schiena è affaticata dal torneo.',
     warning:null},
    {id:'nordiccurl',name:'Nordic Curl / Leg Curl',compound:false,sets:3,reps:'8',
     muscles:['Ischiocrurali','Gastrocnemio'],
     execution:'Nordic: fissa i piedi, parti in ginocchio col corpo dritto. Abbassa lentamente il più possibile resistendo con gli ischiocrurali. Usa le mani per risalire. In macchina: eccentrica lenta 3 sec, concentrica normale. Evita lo slancio.',
     cues:['Il Nordic è difficile: inizia anche con solo 3–4 rep controllate','Concentrati sulla fase di discesa, è quella che conta','In macchina: tieni la contrazione 1 sec in fondo'],
     errors:['Compensi con la schiena','Velocità eccessiva che elimina il lavoro eccentrico'],
     tip:'Il principale stabilizzatore del ginocchio nell\'atterraggio da muro. Non saltarlo mai.',
     warning:null},
    {id:'calf',name:'Calf Raise (in piedi)',compound:false,sets:4,reps:'12',
     muscles:['Gastrocnemio','Soleo'],
     execution:'In piedi, preferibilmente su un gradino con il tallone nel vuoto per il range completo. Salita esplosiva fino alla punta massima, tenuta 1 sec in cima, discesa lenta in 3 sec fino a sentire lo stretch. Usa la macchina apposita o il bordo di un gradino.',
     cues:['La fase eccentrica (discesa) è la più importante','Tieni la contrazione in cima prima di scendere','Fai entrambi i piedi insieme o un piede alla volta per più intensità'],
     errors:['Discesa troppo veloce: perdi il beneficio eccentrico','Range ridotto: scendi più in basso possibile'],
     tip:'L\'eccentrica lenta protegge il tendine d\'Achille, molto sollecitato nel beach volley su sabbia.',
     warning:null},
    {id:'deadbug',name:'Dead Bug',compound:false,sets:3,reps:'10/lato',
     muscles:['Core (traverso)','Psoas','Stabilizzatori lombari'],
     execution:'Sdraiato sul pavimento, schiena completamente incollata (nessuno spazio tra lombare e pavimento). Braccia verso il soffitto, cosce verticali, ginocchia a 90°. Estendi simultaneamente braccio destro sopra la testa e gamba sinistra verso il pavimento, espirando lentamente. Ritorna e ripeti dall\'altro lato. Non lasciare mai che la lombare si sollevi.',
     cues:['Se la lombare si solleva, riduci il range di movimento','Espira lentamente durante l\'estensione','Movimento lento e controllato, non veloce'],
     errors:['Lombare che si distacca dal pavimento: è la cosa da evitare assolutamente','Movimento troppo veloce che diventa slancio'],
     tip:'Core antiflessione: trasferisce direttamente la forza dal basso verso l\'alto nel salto.',
     warning:null}
  ]},
  B:{title:'Upper — Orizzontale',upper:true,ex:[
    {id:'panca_mdb',name:'Panca Piana Manubri',compound:true,sets:4,reps:'8',
     muscles:['Pettorali','Deltoide anteriore','Tricipiti'],
     execution:'Sdraiato su panca, scapole retratte e depresse (come se volessi mettere le scapole in tasca). Manubri all\'altezza del petto con gomiti a 45–60° rispetto al busto, non a 90°. Discesa controllata finché i manubri sono all\'altezza del petto. Spingi verso l\'alto e leggermente verso l\'interno.',
     cues:['Scapole sempre retratte: non lasciare che le spalle salgano','Piedi a terra, schiena neutra con arcata naturale','Gomiti non a 90°: evita lo stress sulla cuffia'],
     errors:['Spalle che salgono verso le orecchie: perdi la base scapolare','Rimbalzo sul petto: eccentrica controllata sempre'],
     tip:'I manubri invece del bilanciere permettono alla cuffia di trovare la traiettoria naturale.',
     warning:'SPALLA: Se senti fastidio articolare (non bruciore muscolare) alla spalla destra, riduci il range o salta l\'esercizio.'},

        {c1:'Mozzarella 100g',c2:'~18g'},
        {c1:'Whey protein 1 scoop',c2:'~25g'}
      ]},
      {t:'Carboidrati — non eliminarli',
       tx:'Sei un atleta che fa sport esplosivi. Il glicogeno muscolare è il tuo carburante principale. Pasta, riso, pane, frutta non sono il nemico. Più carboidrati nei giorni di allenamento o partita, meno nei giorni di riposo completo.'},
      {t:'Surplus calorico',
       tx:'Per mettere massa devi mangiare leggermente più di quello che consumi. 200–300 kcal sopra il mantenimento sono sufficienti per massimizzare la crescita limitando il grasso. Il tuo mantenimento estivo con tutto questo sport è probabilmente 2800–3200 kcal.'},
      {t:'Idratazione',
       tx:'Almeno 3 litri al giorno, di più nei giorni di torneo o beach. Le urine devono essere giallo chiaro. La disidratazione cronica è uno dei principali sabotatori del recupero e della performance.'}
    ]
  },
  {
    id:'supplements', label:'Integratori', col:'var(--C)',
    blocks:[
      {t:'Creatina monoidrato — sì',
       tx:'L\'integratore più studiato in assoluto. Migliora la potenza nei gesti esplosivi brevi (salto, muro), riduce l\'affaticamento nei set ripetuti, aiuta il recupero tra sessioni ravvicinate. Dose: 3–5g al giorno, ogni giorno anche a riposo. Forma: monoidrato pura. Quando: qualsiasi momento. Effetto collaterale: +1–2 kg di ritenzione intracellulare nelle prime settimane (non grasso).'},
      {t:'Proteine in polvere — dipende',
       tx:'Non sono speciali: modo comodo per raggiungere il fabbisogno. Se arrivi a 120–150g col cibo, non ti servono. Se fai fatica: uno shaker da 25–30g dopo l\'allenamento risolve. Whey concentrate o isolate: entrambe valide.'},
      {t:'Vitamina D — considera',
       tx:'In estate con esposizione solare probabilmente stai bene. Se ti alleni spesso al chiuso la sera: 1000–2000 UI al giorno non fa male. Coinvolta nella funzione muscolare e risposta immunitaria. Costa pochissimo.'},
      {t:'Non vale la pena',
       tx:'Pre-workout commerciali: caffeina + beta-alanina + marketing. Un caffè fa lo stesso. BCAA: se mangi abbastanza proteine sono inutili. Bruciagrassi e boost testosterone naturali: non funzionano. Risparmia i soldi e investili in cibo di qualità.'}
    ]
  },
  {
    id:'schedule', label:'Gestione tornei', col:'var(--D)',
    blocks:[
      {t:'Piano modulare',
       tx:'2 giorni disponibili: A + B. 3 giorni: A + B + C (o D, alternando le settimane). 4 giorni: A + B + C + D. Non chiamarla settimana persa se fai solo 2 giorni: è gestione intelligente del carico.'},
      {t:'Settimana con torneo',
       tx:'Solo A e B, volume ridotto del 30%. Non allenarti il giorno prima della partita. Dopo la gara: almeno 48 ore prima del prossimo allenamento. RPE massimo: 6.'},
      {t:'Weekend di torneo beach',
       tx:'Beach aumenta lo stress sul tendine d\'Achille e i polpacci. In quella settimana: riduci o elimina il calf raise in palestra. Priorità al recupero tra le gare.'},
      {t:'Progressione carico',
       tx:'Aggiungi carico solo quando completi tutte le serie con tecnica impeccabile. +2.5kg ogni 1–2 settimane sui compound. Se la tecnica crolla, mantieni il peso della settimana precedente.'},
      {t:'Fase 1 — Ricondizionamento',
       tx:'Settimane 1–3: riduci di 1 serie gli esercizi compound, carichi al 60–70% del percepito. I tendini impiegano 3 volte più dei muscoli ad adattarsi. Pazienza ora = meno infortuni dopo.'},
      {t:'Dolore alla spalla',
       tx:'Distingui bruciore muscolare (ok) da fastidio articolare (stop). Al minimo fastidio alla spalla destra su qualsiasi esercizio overhead o di spinta, interrompi. Non spingere mai attraverso il dolore alla cuffia.'}
    ]
  },
  {
    id:'exercises', label:'Esercizi', col:'var(--B)',
    isExercises: true
  }
];

// ─── STATE ────────────────────────────────────────────────
function loadSt(){try{return JSON.parse(localStorage.getItem('vp2'))||{};}catch{return{};}}
function saveSt(){try{localStorage.setItem('vp2',JSON.stringify(st));}catch{}}

let st = {
  week:1, phase:1,
  sec:'workout', day:'A',
  guideTab:'results',
  doneMap:{}, logMap:{},
  openCards:{}, openLogs:{},
  openExGuide:{},
  ...loadSt()
};

// ─── RENDER ───────────────────────────────────────────────
function render(){
  saveSt();
  document.getElementById('wkLabel').textContent = 'W'+st.week;
  const p = st.phase;
  document.getElementById('ph1').className = 'phbdg '+(p===1?'ph1on':'phoff');
  document.getElementById('ph2').className = 'phbdg '+(p===2?'ph2on':'phoff');
  document.getElementById('phDesc').textContent = p===1 ? 'Sett. 1–3 · Carichi moderati' : 'Sett. 4+ · Volume pieno';
  document.querySelectorAll('.nt').forEach(t=>t.classList.remove('on'));
  const ta = document.getElementById('tn-'+st.sec);
  if(ta) ta.classList.add('on');
  const c = document.getElementById('cnt');
  c.innerHTML='';
  if(st.sec==='workout') renderWorkout(c);
  else if(st.sec==='overview') renderOverview(c);
  else if(st.sec==='guide') renderGuide(c);
}

// ─── WORKOUT ──────────────────────────────────────────────
function renderWorkout(c){
  // Modular hint
  const mh = mk('div','mhint');
  mh.innerHTML = '<div class="stit" style="margin-bottom:4px">Piano modulare</div>'+
    [{n:2,chips:['A','B']},{n:3,chips:['A','B','C/D']},{n:4,chips:['A','B','C','D']}].map(r=>
      '<div class="mrow"><div class="mkey">'+r.n+' gg/sett.</div><div style="display:flex;gap:5px">'+
      r.chips.map(d=>{const col=COL[d]||'rgba(255,255,255,0.3)';return'<span class="mchip" style="color:'+col+';border-color:'+col+'">'+d+'</span>';}).join('')+
      '</div></div>'
    ).join('');
  c.appendChild(mh);

  // Day tabs
  const dt = mk('div','dtabs');
  ['A','B','C','D'].forEach(d=>{
    const w=WK[d], col=COL[d], act=st.day===d;
    const done=st.doneMap[d+'_w'+st.week];
    const tab=mk('div','dt');
    if(act){tab.style.background=hexA(col,0.15);tab.style.borderColor=col;}
    tab.innerHTML='<div class="dtl" style="color:'+(act?col:'')+'">'+d+(done?' ✓':'')+'</div>'+
      '<div class="dts" style="color:'+(act?col:'')+'">'+( w.upper?'Upper':'Lower')+'</div>';
    tab.onclick=()=>{st.day=d;render();};
    dt.appendChild(tab);
  });
  c.appendChild(dt);

  const d=st.day, w=WK[d], col=COL[d];
  const doneKey=d+'_w'+st.week, done=st.doneMap[doneKey];

  // Day header
  const dh=mk('div','dhdr');
  const dnbtn=mk('button','dnbtn');
  dnbtn.style.cssText='color:'+(done?'#000':col)+';border-color:'+col+';background:'+(done?col:'transparent');
  dnbtn.textContent=done?'✓ Completato':'Segna fatto';
  dnbtn.onclick=()=>{st.doneMap[doneKey]=!done;if(!done)toast('Completato 💪');render();};
  dh.innerHTML='<div><div class="dbig" style="color:'+col+'">Giorno '+d+'</div><div class="dsub">'+w.title+'</div></div>';
  dh.appendChild(dnbtn);
  c.appendChild(dh);

  if(st.phase===1){
    const pn=mk('div','phnote');
    pn.textContent='⚡ Fase 1: riduci di 1 serie gli esercizi compound. Priorità alla tecnica, non al carico.';
    c.appendChild(pn);
  }

  if(w.upper){
    const wu=mk('div','wu');
    wu.innerHTML='<div class="wutit">⚠️ Riscaldamento Spalla (a casa prima di uscire)</div>'+
      ['Band pull-apart 2×15','Rotazioni elastico 2×15/lato','W-press elastico 2×12','Arm circles 30 sec','Pendolo passivo 30 sec/lato']
      .map(s=>'<div class="wuit">'+s+'</div>').join('');
    c.appendChild(wu);
  }

  w.ex.forEach(ex=>{
    let sets=ex.sets;
    if(ex.compound && st.phase===1) sets=Math.max(2,sets-1);
    c.appendChild(renderExCard(ex,sets,col));
  });
}

function renderExCard(ex,sets,col){
  const isOpen=!!st.openCards[ex.id];
  const isLogOpen=!!st.openLogs[ex.id];
  const entries=st.logMap[ex.id]||[];
  const last=entries[entries.length-1];

  const card=mk('div','ec'+(isOpen?' open':''));
  card.id='ec_'+ex.id;

  const hdr=mk('div','ech');
  hdr.innerHTML='<div class="ecl"><div class="ecdot" style="background:'+col+'"></div><div class="ecn">'+ex.name+'</div><div class="ecb">'+sets+'×'+ex.reps+'</div></div>'+
    '<div class="ecr">'+(last?'<span class="ecklg" style="color:'+col+'">'+last.kg+'kg</span>':'')+
    '<span class="ecch">›</span></div>';
  hdr.onclick=()=>{st.openCards[ex.id]=!isOpen;render();};
  card.appendChild(hdr);

  const body=mk('div','ecb2');
  let bh='<div class="eclbl" style="color:'+col+'">Esecuzione</div>'+
    '<div class="ecex">'+ex.execution+'</div>'+
    '<div class="ectip">'+ex.tip+'</div>';
  if(ex.warning) bh+='<div class="ecwarn">'+ex.warning+'</div>';
  bh+='<div class="lgtog'+(isLogOpen?' on':'')+'" id="lt_'+ex.id+'">📊 Log '+(entries.length>0?'('+entries.length+')':'')+'</div>'+
    '<div class="lgarea'+(isLogOpen?' on':'')+'" id="la_'+ex.id+'">';

  if(entries.length>0){
    const recent=entries.slice(-7);
    const kgs=recent.map(e=>parseFloat(e.kg));
    const mx=Math.max(...kgs), mn=Math.min(...kgs), rng=mx-mn||1;
    bh+='<div class="chbars">'+recent.map(e=>{const h=8+((parseFloat(e.kg)-mn)/rng)*32;return'<div class="chbar" style="height:'+h+'px;background:'+col+'"></div>';}).join('')+'</div>'+
      '<div class="chlbls">'+recent.map(e=>'<div class="chlbl">'+e.kg+'</div>').join('')+'</div>';
    bh+='<div style="height:10px"></div>'+entries.slice().reverse().slice(0,5).map(e=>
      '<div class="lge"><span class="lgedt">'+e.date+'</span><span class="lgekg" style="color:'+col+'">'+e.kg+'kg</span>'+(e.note?'<span class="lgenote">'+e.note+'</span>':'')+'</div>'
    ).join('');
  } else {
    bh+='<div class="lgempty">Nessun dato ancora.</div>';
  }
  bh+='<div class="lgrow" style="margin-top:9px">'+
    '<input class="lgi kg" id="kg_'+ex.id+'" type="number" placeholder="kg" inputmode="decimal">'+
    '<input class="lgi nt" id="nt_'+ex.id+'" type="text" placeholder="nota (opz.)">'+
    '<button class="lgadd" id="la2_'+ex.id+'" style="background:'+col+';color:#000">+</button>'+
    '</div></div>';

  body.innerHTML=bh;

  body.querySelector('#lt_'+ex.id).onclick=e=>{e.stopPropagation();st.openLogs[ex.id]=!isLogOpen;render();};
  const addBtn=body.querySelector('#la2_'+ex.id);
  if(addBtn) addBtn.onclick=e=>{
    e.stopPropagation();
    const kgEl=body.querySelector('#kg_'+ex.id);
    const ntEl=body.querySelector('#nt_'+ex.id);
    const kg=kgEl.value.trim();
    if(!kg){kgEl.style.borderColor='rgba(255,85,85,0.6)';return;}
    const entry={date:new Date().toLocaleDateString('it-IT'),kg:parseFloat(kg),note:ntEl.value.trim()};
    st.logMap[ex.id]=[...(st.logMap[ex.id]||[]),entry];
    st.openLogs[ex.id]=true;
    toast(ex.name+': '+kg+'kg ✓');
    render();
  };

  card.appendChild(body);
  return card;
}

// ─── OVERVIEW ─────────────────────────────────────────────
function renderOverview(c){
  const allD=['A','B','C','D'];
  const doneCt=allD.filter(d=>st.doneMap[d+'_w'+st.week]).length;
  const totalLog=Object.values(st.logMap).reduce((s,e)=>s+e.length,0);
  const prs=countPRs();

  const og=mk('div','ovgrid');
  og.innerHTML=[
    {n:doneCt+'/4',l:'Sessioni W'+st.week,c:'var(--A)'},
    {n:totalLog,l:'Log totali',c:'var(--B)'},
    {n:prs,l:'PR personali',c:'var(--C)'},
    {n:'W'+st.week,l:'Settimana',c:'var(--D)'}
  ].map(x=>'<div class="ovcard"><div class="ovnum" style="color:'+x.c+'">'+x.n+'</div><div class="ovlbl">'+x.l+'</div></div>').join('');
  c.appendChild(og);

  const wt=mk('div','stit'); wt.textContent='Settimana '+st.week; c.appendChild(wt);
  const dg=mk('div',''); dg.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px';
  allD.forEach(d=>{
    const col=COL[d], done=st.doneMap[d+'_w'+st.week];
    const dc=mk('div','');
    dc.style.cssText='background:'+(done?hexA(col,0.12):'var(--s1)')+';border:1px solid '+(done?col:'var(--bd)')+';border-radius:10px;padding:12px;';
    dc.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:22px;font-weight:900;color:'+(done?col:'var(--mu2)')+'">'+d+'</span>'+
      '<span style="font-size:18px">'+(done?'✓':'○')+'</span></div>'+
      '<div style="font-size:11px;color:'+(done?col:'var(--mu)')+';margin-top:3px;text-transform:uppercase;letter-spacing:0.5px">'+(WK[d].upper?'Upper':'Lower')+'</div>';
    dg.appendChild(dc);
  });
  c.appendChild(dg);

  const lt=mk('div','stit'); lt.textContent='Massimi registrati'; c.appendChild(lt);
  const topIds=['squat','rdl','rematore_bb','lat_machine','bss','hip_thrust','sp_mdb'];
  const tw=mk('div',''); tw.style.cssText='display:flex;flex-direction:column;gap:7px;margin-bottom:18px';
  let any=false;
  topIds.forEach(id=>{
    const entries=st.logMap[id]||[];
    if(!entries.length) return;
    any=true;
    const maxKg=Math.max(...entries.map(e=>parseFloat(e.kg)));
    const name=findExName(id), dcol=findExCol(id);
    const row=mk('div','');
    row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--s1);border-radius:9px;border:1px solid var(--bd)';
    row.innerHTML='<span style="font-size:13px;color:#bbb">'+name+'</span>'+
      '<span style="font-family:\'Barlow Condensed\',sans-serif;font-size:20px;font-weight:700;color:'+dcol+'">'+maxKg+'kg</span>';
    tw.appendChild(row);
  });
  if(!any){
    const em=mk('div',''); em.style.cssText='color:var(--mu2);font-size:13px;padding:10px 0;text-align:center';
    em.textContent='Nessun dato ancora. Inizia ad allenarti!';
    tw.appendChild(em);
  }
  c.appendChild(tw);
}

// ─── GUIDE ────────────────────────────────────────────────
function renderGuide(c){
  // Sub nav
  const gnav=mk('div','gnav');
  GUIDE_SECTIONS.forEach(gs=>{
    const act=st.guideTab===gs.id;
    const btn=mk('button','gnbtn'+(act?' on':''));
    if(act){btn.style.background=gs.col;btn.style.borderColor=gs.col;}
    btn.textContent=gs.label;
    btn.onclick=()=>{st.guideTab=gs.id;render();};
    gnav.appendChild(btn);
  });
  c.appendChild(gnav);

  const gs=GUIDE_SECTIONS.find(x=>x.id===st.guideTab);
  if(!gs) return;

  if(gs.isExercises){
    renderExercisesGuide(c);
    return;
  }

  gs.blocks.forEach(block=>{
    const wrap=mk('div','');
    wrap.style.marginBottom='14px';
    let h='<div class="gtit" style="color:'+gs.col+'">'+block.t+'</div>';
    if(block.tx) h+='<div class="gcard">'+block.tx+'</div>';
    if(block.table){
      h+='<div class="gtable">'+block.table.map((row,i)=>
        '<div class="gtrow"><span class="gtleft">'+row.c1+'</span><span class="gtright" style="color:'+gs.col+'">'+row.c2+'</span></div>'
      ).join('')+'</div>';
    }
    wrap.innerHTML=h;
    c.appendChild(wrap);
  });
}

function renderExercisesGuide(c){
  const col='var(--B)';
  ['A','B','C','D'].forEach(dayKey=>{
    const w=WK[dayKey], dcol=COL[dayKey];
    const cat=mk('div','egcat');
    cat.style.color=dcol;
    cat.textContent='Giorno '+dayKey+' — '+w.title;
    c.appendChild(cat);

    w.ex.forEach(ex=>{
      const isOpen=!!st.openExGuide[ex.id];
      const card=mk('div','egcard'+(isOpen?' open':''));

      const ch=mk('div','egch');
      ch.innerHTML='<div class="egnm">'+ex.name+'</div>'+
        '<div style="display:flex;align-items:center;gap:8px">'+
        '<span class="egday" style="color:'+dcol+';border-color:'+dcol+'">'+dayKey+'</span>'+
        '<span class="ecch" style="color:var(--mu2)">›</span></div>';
      ch.onclick=()=>{st.openExGuide[ex.id]=!isOpen;render();};
      card.appendChild(ch);

      const body=mk('div','egbody');
      let bh='';

      // Muscles
      bh+='<div class="egsec" style="color:'+dcol+'">Muscoli coinvolti</div>'+
        '<div class="egmuscles">'+ex.muscles.map(m=>'<span class="egmtag">'+m+'</span>').join('')+'</div>';

      // Execution
      bh+='<div class="egsec" style="color:'+dcol+'">Esecuzione dettagliata</div>'+
        '<div class="egtext">'+ex.execution+'</div>';

      // Cues
      if(ex.cues && ex.cues.length){
        bh+='<div class="egsec" style="color:'+dcol+'">Cue tecnici</div>'+
          '<ul class="eglist">'+ex.cues.map(c=>'<li>'+c+'</li>').join('')+'</ul>';
      }

      // Errors
      if(ex.errors && ex.errors.length){
        bh+='<div class="egsec" style="color:#FF5555">Errori comuni</div>'+
          '<ul class="eglist">'+ex.errors.map(e=>'<li style="color:#ff9090">'+e+'</li>').join('')+'</ul>';
      }

      // Tip
      bh+='<div class="egsec" style="color:'+dcol+'">Perché è nel programma</div>'+
        '<div class="egtext" style="font-style:italic">'+ex.tip+'</div>';

      // Warning
      if(ex.warning){
        bh+='<div style="margin-top:10px;padding:9px 12px;background:rgba(255,85,85,0.08);border:1px solid rgba(255,85,85,0.2);border-radius:8px;font-size:12px;color:#ff9090;line-height:1.6">⚠️ '+ex.warning+'</div>';
      }

      body.innerHTML=bh;
      card.appendChild(body);
      c.appendChild(card);
    });

    const div=mk('div',''); div.style.cssText='height:1px;background:var(--bd);margin:14px 0';
    c.appendChild(div);
  });
}

// ─── HELPERS ──────────────────────────────────────────────
function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
function countPRs(){let n=0;Object.values(st.logMap).forEach(e=>{if(e.length>=2){const last=parseFloat(e[e.length-1].kg),prev=Math.max(...e.slice(0,-1).map(x=>parseFloat(x.kg)));if(last>prev)n++;}});return n;}
function findExName(id){for(const d of Object.values(WK)){const ex=d.ex.find(e=>e.id===id);if(ex)return ex.name;}return id;}
function findExCol(id){for(const[k,d]of Object.entries(WK)){if(d.ex.find(e=>e.id===id))return COL[k];}return'#fff';}

// ─── CONTROLS ─────────────────────────────────────────────
function changeWeek(dir){st.week=Math.max(1,st.week+dir);render();}
function setPhase(ph){st.phase=ph;toast(ph===1?'Fase 1: Ricondizionamento':'Fase 2: Progressione');render();}
function goSection(s){st.sec=s;render();}

// ─── INIT ─────────────────────────────────────────────────
render();
</script>
